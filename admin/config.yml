        label: "Accueil › Bannière"
        file: "content/editable/accueil-banniere.json"
        i18n: true
        fields:
          - { label: "Accueil › Bannière › Sur-titre", name: "hero.eyebrow", widget: string, i18n: true }
          - { label: "Accueil › Bannière › Titre", name: "hero.title", widget: string, i18n: true }
          - { label: "Accueil › Bannière › Titre (partie en italique)", name: "hero.title_em", widget: string, i18n: true }
          - { label: "Accueil › Bannière › Sous-titre", name: "hero.subtitle", widget: text, i18n: true }
