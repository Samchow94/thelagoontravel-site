[build]
  command = "node scripts/build-i18n.js"
  publish = "."

# Ces dossiers restent dans le dépôt mais ne doivent pas être servis au public (404 forcé,
# même si les fichiers existent). Le build, lui, les lit normalement.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/js/i18n.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Polices hébergées : les fichiers ne changent jamais sous le même nom (un nouveau fichier = un nouveau nom).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
