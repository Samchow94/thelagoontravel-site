# Decap CMS — configuration (voir docs/CMS.md)
# Les textes sont stockés dans content/editable/*.json (fr et en dans le même fichier).
# Ne modifiez ce fichier que pour ajouter, retirer ou renommer un champ.

backend:
  name: github
  repo: Samchow94/thelagoontravel-site
  branch: main

# Test en local : lancer « npx decap-server@3.11.5 » à la racine du projet.
# Cette option n'est active que sur localhost : sur le site en ligne, la connexion GitHub est utilisée.
local_backend: true

locale: fr
publish_mode: simple

# Dossier des médias : volontairement vide et distinct de assets/images, pour que l'onglet « Médias »
# ne puisse ni lister ni supprimer les images du site. Aucun champ image/fichier n'est déclaré.
media_folder: admin/media

i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr

collections:
  - name: "accueil"
    label: "Accueil"
    i18n:
      structure: single_file
      locales: [fr, en]
      default_locale: fr
    files:
